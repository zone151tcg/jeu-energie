<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Jeu de l'Énergie — Zone 151 TCG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b10;
    --bg-glow: radial-gradient(circle at 50% -10%, rgba(255,255,255,0.06), transparent 55%);
    --panel:#12141c;
    --panel-2:#181b26;
    --line:rgba(255,255,255,0.08);
    --text:#f4f5f8;
    --muted:#8b90a3;
    --gold:#e8c15a;

    --feu:#ff5a3c;      --feu-d:#7a1f10;
    --eau:#2f8fe0;      --eau-d:#0d3560;
    --plante:#3fbf5e;   --plante-d:#0f4a1f;
    --electrik:#f2cf1f; --electrik-d:#5c4d05;
    --psy:#c94ecf;      --psy-d:#4d1652;
    --combat:#c9772f;   --combat-d:#4a2607;
    --acier:#9fb2c4;    --acier-d:#33404c;
    --obscur:#5a4b9e;   --obscur-d:#1c1533;
    --dragon:#d9a441;   --dragon-d:#4a3308;
    --incolore:#d8d5c9; --incolore-d:#4a4840;
    --dresseur:#2bb3a3; --dresseur-d:#0c4038;
    --objet:#6f7cf0;    --objet-d:#232a63;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); background-image:var(--bg-glow);
    color:var(--text); font-family:'Inter',sans-serif;
    overflow:hidden; user-select:none;
  }
  #app{height:100vh; height:100dvh; display:flex; flex-direction:column; position:relative;}

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; border-bottom:1px solid var(--line);
    flex:0 0 auto; z-index:20; background:rgba(10,11,16,0.6); backdrop-filter:blur(8px);
  }
  .brand{display:flex; align-items:center; gap:12px; min-width:0;}
  .brand-mark{
    width:34px; height:34px; border-radius:9px; flex:0 0 auto;
    background:linear-gradient(135deg,var(--gold),#8a6a1f);
    display:flex; align-items:center; justify-content:center;
    font-family:'Rajdhani',sans-serif; font-weight:700; color:#1a1200; font-size:16px;
  }
  .brand-text{min-width:0;}
  .brand-text .set-name{font-family:'Rajdhani',sans-serif; font-weight:600; font-size:15px; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .brand-text .serie-name{font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .gear{
    width:40px; height:40px; border-radius:12px; border:1px solid var(--line);
    background:var(--panel); display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex:0 0 auto;
  }
  .gear svg{width:20px; height:20px; stroke:var(--muted);}
  .gear:active{transform:scale(.94);}

  #grid-view{flex:1 1 auto; display:flex; flex-direction:column; min-height:0;}
  .grid-title{
    text-align:center; padding:10px 12px 2px; font-family:'Rajdhani',sans-serif;
    font-size:13px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted);
  }
  .energy-grid{
    flex:1; display:grid; gap:12px; padding:12px 16px 18px;
    grid-template-columns:repeat(4, 1fr); grid-template-rows:repeat(3, 1fr);
  }
  @media (orientation:portrait){
    .energy-grid{grid-template-columns:repeat(3, 1fr); grid-template-rows:repeat(4, 1fr);}
  }
  .tile{
    position:relative; border-radius:18px; border:1px solid rgba(255,255,255,0.10);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    cursor:pointer; overflow:hidden; -webkit-user-select:none;
    transition:transform .12s ease;
  }
  .tile::before{
    content:""; position:absolute; inset:0;
    background:radial-gradient(circle at 30% 20%, rgba(255,255,255,0.20), transparent 60%);
    pointer-events:none;
  }
  .tile:active{transform:scale(.96);}
  .tile .label{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:clamp(14px,2.6vw,22px); letter-spacing:.02em; text-shadow:0 2px 6px rgba(0,0,0,.35);}
  .tile .count{font-size:11px; opacity:.85; font-weight:600;}
  .tile.burst::after{
    content:""; position:absolute; inset:-40%; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.9), rgba(255,255,255,0) 60%);
    animation:burst .55s ease-out forwards;
  }
  @keyframes burst{0%{opacity:.9; transform:scale(0);} 100%{opacity:0; transform:scale(2.2);}}

  .t-feu{background:linear-gradient(160deg,var(--feu),var(--feu-d));}
  .t-eau{background:linear-gradient(160deg,var(--eau),var(--eau-d));}
  .t-plante{background:linear-gradient(160deg,var(--plante),var(--plante-d));}
  .t-electrik{background:linear-gradient(160deg,var(--electrik),var(--electrik-d)); color:#1a1500;}
  .t-psy{background:linear-gradient(160deg,var(--psy),var(--psy-d));}
  .t-combat{background:linear-gradient(160deg,var(--combat),var(--combat-d));}
  .t-acier{background:linear-gradient(160deg,var(--acier),var(--acier-d)); color:#10151a;}
  .t-obscur{background:linear-gradient(160deg,var(--obscur),var(--obscur-d));}
  .t-dragon{background:linear-gradient(160deg,var(--dragon),var(--dragon-d));}
  .t-incolore{background:linear-gradient(160deg,var(--incolore),var(--incolore-d)); color:#181818;}
  .t-dresseur{background:linear-gradient(160deg,var(--dresseur),var(--dresseur-d));}
  .t-objet{background:linear-gradient(160deg,var(--objet),var(--objet-d));}

  #gallery-view{
    position:absolute; inset:0; display:flex; flex-direction:column;
    background:var(--bg); background-image:var(--bg-glow);
    transform:translateY(100%); transition:transform .32s cubic-bezier(.2,.8,.2,1);
    z-index:15;
  }
  #gallery-view.open{transform:translateY(0);}
  .gallery-header{
    flex:0 0 auto; padding:16px 18px; display:flex; align-items:center; gap:14px;
    border-bottom:1px solid var(--line);
  }
  .back-btn{
    display:flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--panel);
    color:var(--text); font-family:'Rajdhani',sans-serif; font-weight:600; font-size:15px;
    padding:10px 16px; border-radius:12px; cursor:pointer;
  }
  .back-btn:active{transform:scale(.96);}
  .gallery-title{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:20px; display:flex; align-items:center; gap:10px;}
  .gallery-chip{width:16px; height:16px; border-radius:5px;}
  .gallery-count{margin-left:auto; font-size:12px; color:var(--muted); font-family:'Rajdhani',sans-serif; letter-spacing:.05em;}
  .gallery-body{flex:1; overflow-y:auto; padding:16px 18px 30px;}
  .card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px;}
  .card-item{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden;
    display:flex; flex-direction:column; cursor:pointer;
  }
  .card-item img{width:100%; display:block; aspect-ratio:5/7; object-fit:cover; background:var(--panel-2);}
  .card-item .ph{width:100%; aspect-ratio:5/7; display:flex; align-items:center; justify-content:center; text-align:center; padding:10px; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:14px;}
  .card-item .cn{padding:8px 9px; font-size:12px; color:var(--text); font-weight:500; line-height:1.25;}
  .card-item .cr{padding:0 9px 8px; font-size:10.5px; color:var(--muted); font-weight:600; letter-spacing:.03em; text-transform:uppercase;}
  .empty-state, .loading-state{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    height:100%; color:var(--muted); text-align:center; padding:40px;
  }
  .empty-state svg{width:40px; height:40px; stroke:var(--muted);}

  #lightbox{
    position:fixed; inset:0; background:rgba(0,0,0,0.88); z-index:60; display:none;
    align-items:center; justify-content:center; padding:30px;
  }
  #lightbox.open{display:flex;}
  #lightbox img{max-width:90%; max-height:90%; border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.6);}

  .config-prompt{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; text-align:center; padding:30px;
  }
  .config-prompt h2{font-family:'Rajdhani',sans-serif; font-size:22px; margin:0;}
  .config-prompt p{color:var(--muted); max-width:380px; margin:0; font-size:14px;}
  .cta{
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:16px; letter-spacing:.03em;
    background:var(--gold); color:#1a1200; border:none; padding:12px 26px; border-radius:12px; cursor:pointer;
  }

  #settings-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:50; display:none;
    align-items:flex-end; justify-content:center;
  }
  #settings-overlay.open{display:flex;}
  #settings{
    width:100%; max-width:640px; max-height:88vh; background:var(--panel);
    border-radius:20px 20px 0 0; border:1px solid var(--line); border-bottom:none;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .settings-header{padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;}
  .settings-header h3{margin:0; font-family:'Rajdhani',sans-serif; font-size:18px;}
  .settings-close{border:none; background:none; color:var(--muted); font-size:20px; cursor:pointer; padding:4px 8px;}
  .settings-body{overflow-y:auto; padding:18px 20px 30px;}
  .field{margin-bottom:20px;}
  .field label{display:block; font-family:'Rajdhani',sans-serif; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:8px;}
  .field input[type=text]{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:11px 13px; border-radius:10px; font-size:15px; font-family:'Inter',sans-serif;
  }
  .field textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:11px 13px; border-radius:10px; font-size:13.5px; font-family:'SFMono-Regular',Menlo,monospace;
    min-height:130px; resize:vertical; line-height:1.5;
  }
  .set-list{display:flex; flex-wrap:wrap; gap:8px; margin-top:4px;}
  .set-chip{
    display:flex; align-items:center; gap:6px;
    padding:8px 13px; border-radius:20px; border:1px solid var(--line); background:var(--panel-2);
    font-size:13px; cursor:pointer;
  }
  .set-chip.active{background:var(--gold); color:#1a1200; border-color:var(--gold); font-weight:600;}
  .set-chip .del{opacity:.6; font-weight:700;}
  .btn-row{display:flex; gap:10px; margin-top:10px; flex-wrap:wrap;}
  .btn{
    padding:10px 16px; border-radius:10px; border:1px solid var(--line); background:var(--panel-2);
    color:var(--text); font-family:'Rajdhani',sans-serif; font-weight:600; font-size:14px; cursor:pointer;
  }
  .btn.primary{background:var(--gold); color:#1a1200; border-color:var(--gold);}
  .btn.danger{color:#ff8a7a; border-color:rgba(255,90,60,0.35);}
  .hint{font-size:12px; color:var(--muted); margin-top:8px; line-height:1.45;}
  .summary{
    margin-top:12px; padding:10px 12px; background:var(--panel-2); border-radius:10px;
    font-size:12.5px; color:var(--text); line-height:1.6;
  }
  .subhead{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:14px; letter-spacing:.08em; text-transform:uppercase; color:var(--text); margin:26px 0 10px; padding-top:14px; border-top:1px solid var(--line);}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">
      <div class="brand-mark">151</div>
      <div class="brand-text">
        <div class="set-name" id="hdr-set">Aucune série configurée</div>
        <div class="serie-name" id="hdr-serie">Zone 151 TCG · Jeu de l'Énergie</div>
      </div>
    </div>
    <div class="gear" id="btn-settings" aria-label="Réglages">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09c0 .68.4 1.28 1 1.51.62.25 1.34.12 1.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06c-.45.48-.58 1.2-.33 1.82.23.6.83 1 1.51 1H21a2 2 0 010 4h-.09c-.68 0-1.28.4-1.51 1z"></path></svg>
    </div>
  </header>

  <div id="grid-view">
    <div class="config-prompt" id="config-prompt" style="display:none;">
      <h2>Alimente ta base de cartes</h2>
      <p>Ouvre les réglages pour créer une série et coller ta liste de cartes (nom, énergie, rareté).</p>
      <button class="cta" id="cta-open-settings">Ouvrir les réglages</button>
    </div>
    <template id="tpl-grid">
      <div class="grid-title" id="grid-title">Tirage en cours — touche une énergie</div>
      <div class="energy-grid" id="energy-grid"></div>
    </template>
  </div>

  <div id="gallery-view">
    <div class="gallery-header">
      <button class="back-btn" id="btn-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
        Retour
      </button>
      <div class="gallery-title"><span class="gallery-chip" id="gallery-chip"></span><span id="gallery-label"></span></div>
      <div class="gallery-count" id="gallery-count"></div>
    </div>
    <div class="gallery-body" id="gallery-body"></div>
  </div>

  <div id="lightbox"><img id="lightbox-img" src="" alt=""></div>

  <div id="settings-overlay">
    <div id="settings">
      <div class="settings-header">
        <h3>Base de cartes</h3>
        <button class="settings-close" id="btn-close-settings">✕</button>
      </div>
      <div class="settings-body">

        <div class="field">
          <label>Séries enregistrées</label>
          <div class="set-list" id="set-list"></div>
          <div class="hint">Touche une série pour l'activer. Touche le × pour la supprimer.</div>
        </div>

        <div class="field">
          <label>Nom de la nouvelle série (ou série active)</label>
          <input type="text" id="input-serie" placeholder="ex. ME02 Flammes Fantasmagoriques">
        </div>

        <div class="field">
          <label>Coller la liste de cartes</label>
          <textarea id="input-cards" placeholder="Une carte par ligne, séparée par des points-virgules :
Dracaufeu ex;Feu;EX
Miraidon ex;Électrik;EX;https://exemple.com/image.jpg
Prof. Chen;Dresseur;Full Art

Format : Nom;Énergie;Rareté;Image (l'image est optionnelle)
Énergies valables : Feu, Eau, Plante, Électrik, Psy, Combat, Acier, Obscur, Dragon, Incolore, Dresseur, Objet"></textarea>
          <div class="btn-row">
            <button class="btn primary" id="btn-import-replace">Importer (remplace la série)</button>
            <button class="btn" id="btn-import-append">Ajouter à la série</button>
          </div>
          <div class="btn-row">
            <button class="btn danger" id="btn-clear">Vider cette série</button>
          </div>
          <div class="summary" id="import-summary"></div>
        </div>

        <div class="field">
          <label>Sauvegarde / transfert vers un autre appareil</label>
          <textarea id="backup-text" placeholder="Clique sur « Générer l'export » pour remplir cette zone, puis copie le texte pour le sauvegarder (Notes, Mail...). Sur un autre appareil, colle-le ici et clique sur « Importer »." style="min-height:100px;"></textarea>
          <div class="btn-row">
            <button class="btn" id="btn-export">Générer l'export</button>
            <button class="btn" id="btn-copy">Copier</button>
          </div>
          <div class="btn-row">
            <button class="btn primary" id="btn-import-backup">Importer ce texte (fusionne avec l'existant)</button>
          </div>
          <div class="hint" id="backup-status"></div>
        </div>

      </div>
    </div>
  </div>

</div>

<script>
const ENERGIES = [
  {key:"feu", label:"Feu", cls:"t-feu"},
  {key:"eau", label:"Eau", cls:"t-eau"},
  {key:"plante", label:"Plante", cls:"t-plante"},
  {key:"electrik", label:"Électrik", cls:"t-electrik"},
  {key:"psy", label:"Psy", cls:"t-psy"},
  {key:"combat", label:"Combat", cls:"t-combat"},
  {key:"acier", label:"Acier", cls:"t-acier"},
  {key:"obscur", label:"Obscur", cls:"t-obscur"},
  {key:"dragon", label:"Dragon", cls:"t-dragon"},
  {key:"incolore", label:"Incolore", cls:"t-incolore"},
  {key:"dresseur", label:"Dresseur", cls:"t-dresseur"},
  {key:"objet", label:"Objet", cls:"t-objet"},
];

let db = { sets:{}, active:null };

function normalizeStr(s){
  return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
}
const ENERGY_KEY_BY_NORM = {};
ENERGIES.forEach(e => ENERGY_KEY_BY_NORM[normalizeStr(e.label)] = e.key);

function loadDb(){
  try{
    const raw = localStorage.getItem("jde-db");
    if(raw) db = JSON.parse(raw);
  }catch(e){}
}
function saveDb(){
  try{ localStorage.setItem("jde-db", JSON.stringify(db)); }catch(e){}
}

function parseCardLines(text){
  const cards = [];
  text.split("\n").forEach(line=>{
    const trimmed = line.trim();
    if(!trimmed) return;
    const parts = trimmed.split(";").map(p=>p.trim());
    if(parts.length < 2) return;
    const [name, energyRaw, rarity, image] = parts;
    const key = ENERGY_KEY_BY_NORM[normalizeStr(energyRaw)];
    if(!key) return; // ligne ignorée si l'énergie ne correspond à aucune des 12 catégories
    cards.push({ name, energyKey:key, rarity: rarity||"", image: image||"" });
  });
  return cards;
}

function currentCards(){
  if(!db.active || !db.sets[db.active]) return [];
  return db.sets[db.active];
}

/* ---------------- Header / grid ---------------- */
function renderHeader(){
  document.getElementById("hdr-set").textContent = db.active || "Aucune série configurée";
  const n = currentCards().length;
  document.getElementById("hdr-serie").textContent = db.active ? `${n} carte${n>1?"s":""} · Jeu de l'Énergie` : "Zone 151 TCG · Jeu de l'Énergie";
}

function countByEnergy(cards){
  const counts = {};
  ENERGIES.forEach(e=>counts[e.key]=0);
  cards.forEach(c=>{ if(counts[c.energyKey]!==undefined) counts[c.energyKey]++; });
  return counts;
}

function renderGridView(){
  const promptEl = document.getElementById("config-prompt");
  const gridView = document.getElementById("grid-view");
  gridView.querySelectorAll(".grid-title, .energy-grid").forEach(n=>n.remove());

  const cards = currentCards();
  if(!db.active || cards.length===0){
    promptEl.style.display = "flex";
    return;
  }
  promptEl.style.display = "none";
  const tpl = document.getElementById("tpl-grid").content.cloneNode(true);
  gridView.appendChild(tpl);
  const grid = document.getElementById("energy-grid");
  const counts = countByEnergy(cards);
  ENERGIES.forEach(e=>{
    const tile = document.createElement("div");
    tile.className = "tile " + e.cls;
    tile.innerHTML = `<div class="label">${e.label}</div><div class="count">${counts[e.key]} carte${counts[e.key]>1?"s":""}</div>`;
    tile.addEventListener("click", ()=> onTileTap(tile, e));
    grid.appendChild(tile);
  });
}

/* ---------------- Tirage ---------------- */
function energyColorVar(e){
  const map = {feu:"--feu",eau:"--eau",plante:"--plante",electrik:"--electrik",psy:"--psy",combat:"--combat",acier:"--acier",obscur:"--obscur",dragon:"--dragon",incolore:"--incolore",dresseur:"--dresseur",objet:"--objet"};
  return getComputedStyle(document.documentElement).getPropertyValue(map[e.key]).trim();
}

function onTileTap(tileEl, energy){
  tileEl.classList.add("burst");
  setTimeout(()=>tileEl.classList.remove("burst"), 600);
  openGallery(energy);
}

function openGallery(energy){
  const view = document.getElementById("gallery-view");
  document.getElementById("gallery-chip").style.background = energyColorVar(energy);
  document.getElementById("gallery-label").textContent = energy.label;
  const matches = currentCards().filter(c=>c.energyKey===energy.key);
  document.getElementById("gallery-count").textContent = matches.length + (matches.length>1 ? " cartes" : " carte");
  renderGalleryCards(matches, energy);
  view.classList.add("open");
}

function renderGalleryCards(cards, energy){
  const body = document.getElementById("gallery-body");
  if(!cards.length){
    body.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 21l-4.35-4.35"></path><circle cx="10" cy="10" r="7"></circle></svg>
      <div>Aucune carte enregistrée pour <b>${energy.label}</b> dans cette série.</div>
    </div>`;
    return;
  }
  const grid = document.createElement("div");
  grid.className = "card-grid";
  cards.forEach(c=>{
    const item = document.createElement("div");
    item.className = "card-item";
    if(c.image){
      item.innerHTML = `<img src="${c.image}" loading="lazy" alt="${c.name}">`;
    } else {
      item.innerHTML = `<div class="ph" style="background:${energyColorVar(energy)}22; color:var(--text);">${c.name}</div>`;
    }
    item.innerHTML += `<div class="cn">${c.name}</div>` + (c.rarity ? `<div class="cr">${c.rarity}</div>` : "");
    item.addEventListener("click", ()=>{
      if(!c.image) return;
      document.getElementById("lightbox-img").src = c.image;
      document.getElementById("lightbox").classList.add("open");
    });
    grid.appendChild(item);
  });
  body.innerHTML = "";
  body.appendChild(grid);
}

document.getElementById("btn-back").addEventListener("click", ()=>{
  document.getElementById("gallery-view").classList.remove("open");
});
document.getElementById("lightbox").addEventListener("click", ()=>{
  document.getElementById("lightbox").classList.remove("open");
});

/* ---------------- Settings ---------------- */
function openSettings(){
  document.getElementById("settings-overlay").classList.add("open");
  document.getElementById("input-serie").value = db.active || "";
  document.getElementById("input-cards").value = "";
  document.getElementById("import-summary").textContent = "";
  renderSetList();
}
function closeSettings(){
  document.getElementById("settings-overlay").classList.remove("open");
}
document.getElementById("btn-settings").addEventListener("click", openSettings);
document.getElementById("cta-open-settings").addEventListener("click", openSettings);
document.getElementById("btn-close-settings").addEventListener("click", ()=>{
  closeSettings();
  renderHeader();
  renderGridView();
});

function renderSetList(){
  const el = document.getElementById("set-list");
  el.innerHTML = "";
  Object.keys(db.sets).forEach(name=>{
    const chip = document.createElement("div");
    chip.className = "set-chip" + (db.active===name ? " active" : "");
    chip.innerHTML = `<span>${name} (${db.sets[name].length})</span><span class="del" data-name="${name}">×</span>`;
    chip.addEventListener("click", (ev)=>{
      if(ev.target.classList.contains("del")){
        delete db.sets[name];
        if(db.active===name) db.active = Object.keys(db.sets)[0] || null;
        saveDb();
        renderSetList();
        document.getElementById("input-serie").value = db.active || "";
        return;
      }
      db.active = name;
      saveDb();
      document.getElementById("input-serie").value = name;
      renderSetList();
    });
    el.appendChild(chip);
  });
}

function getSerieNameInput(){
  return document.getElementById("input-serie").value.trim();
}

function showImportSummary(cards, name, skipped){
  const counts = countByEnergy(cards);
  const lines = ENERGIES.map(e=>`${e.label}: ${counts[e.key]}`).join(" · ");
  let msg = `« ${name} » — ${cards.length} carte(s) au total.<br>${lines}`;
  if(skipped>0) msg += `<br><span style="color:#ff8a7a;">${skipped} ligne(s) ignorée(s) — énergie non reconnue.</span>`;
  document.getElementById("import-summary").innerHTML = msg;
}

document.getElementById("btn-import-replace").addEventListener("click", ()=>{
  const name = getSerieNameInput();
  if(!name){ alert("Donne un nom à la série d'abord."); return; }
  const text = document.getElementById("input-cards").value;
  const totalLines = text.split("\n").filter(l=>l.trim()).length;
  const cards = parseCardLines(text);
  db.sets[name] = cards;
  db.active = name;
  saveDb();
  renderSetList();
  showImportSummary(cards, name, totalLines - cards.length);
});

document.getElementById("btn-import-append").addEventListener("click", ()=>{
  const name = getSerieNameInput();
  if(!name){ alert("Donne un nom à la série d'abord."); return; }
  const text = document.getElementById("input-cards").value;
  const totalLines = text.split("\n").filter(l=>l.trim()).length;
  const newCards = parseCardLines(text);
  db.sets[name] = (db.sets[name] || []).concat(newCards);
  db.active = name;
  saveDb();
  renderSetList();
  showImportSummary(db.sets[name], name, totalLines - newCards.length);
});

document.getElementById("btn-clear").addEventListener("click", ()=>{
  const name = getSerieNameInput() || db.active;
  if(!name || !db.sets[name]) return;
  if(!confirm(`Vider toutes les cartes de « ${name} » ?`)) return;
  db.sets[name] = [];
  saveDb();
  renderSetList();
  document.getElementById("import-summary").textContent = "Série vidée.";
});

/* ---------------- Export / Import ---------------- */
document.getElementById("btn-export").addEventListener("click", ()=>{
  document.getElementById("backup-text").value = JSON.stringify(db, null, 0);
  document.getElementById("backup-status").textContent = "Export généré ci-dessus — copie-le et garde-le quelque part (Notes, Mail, iCloud...).";
});

document.getElementById("btn-copy").addEventListener("click", async ()=>{
  const ta = document.getElementById("backup-text");
  if(!ta.value){ document.getElementById("backup-status").textContent = "Génère d'abord l'export."; return; }
  ta.select();
  ta.setSelectionRange(0, ta.value.length);
  try{
    await navigator.clipboard.writeText(ta.value);
    document.getElementById("backup-status").textContent = "Copié dans le presse-papiers.";
  }catch(e){
    try{
      document.execCommand("copy");
      document.getElementById("backup-status").textContent = "Copié dans le presse-papiers.";
    }catch(e2){
      document.getElementById("backup-status").textContent = "Copie automatique indisponible — le texte est sélectionné, utilise le menu Copier de ton appareil.";
    }
  }
});

document.getElementById("btn-import-backup").addEventListener("click", ()=>{
  const raw = document.getElementById("backup-text").value.trim();
  if(!raw){ document.getElementById("backup-status").textContent = "Colle d'abord un export dans la zone ci-dessus."; return; }
  let parsed;
  try{ parsed = JSON.parse(raw); }
  catch(e){ document.getElementById("backup-status").textContent = "Texte invalide — vérifie que c'est bien un export généré par l'appli."; return; }
  if(!parsed || typeof parsed.sets !== "object"){ document.getElementById("backup-status").textContent = "Format non reconnu."; return; }

  const importedNames = Object.keys(parsed.sets);
  importedNames.forEach(name=>{ db.sets[name] = parsed.sets[name]; });
  if(!db.active && parsed.active) db.active = parsed.active;
  if(!db.active && importedNames.length) db.active = importedNames[0];
  saveDb();
  renderSetList();
  document.getElementById("input-serie").value = db.active || "";
  document.getElementById("backup-status").textContent = `${importedNames.length} série(s) importée(s) : ${importedNames.join(", ")}.`;
});

/* ---------------- Init ---------------- */
loadDb();
renderHeader();
renderGridView();
</script>
</body>
</html>
